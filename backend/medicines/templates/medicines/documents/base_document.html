<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}{% endblock %} - {{ application.medicine_name }}</title>
    <style>
        :root { --ink: #111; --line: #222; --muted: #555; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #e9ecef; font-family: 'Times New Roman', Times, serif; color: var(--ink); }
        .toolbar { position: sticky; top: 0; z-index: 10; display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; font-family: Arial, sans-serif; }
        .toolbar button, .toolbar a { padding: 8px 18px; border-radius: 6px; border: 1px solid #1a4a38; background: #1a4a38; color: #fff; font-size: 14px; cursor: pointer; text-decoration: none; }
        .toolbar a { background: #fff; color: #1a4a38; }
        .page { width: 210mm; min-height: 297mm; margin: 16px auto; background: #fff; padding: 14mm; box-shadow: 0 4px 18px rgba(0,0,0,.12); }
        .frame { border: 3px double var(--line); outline: 1px solid var(--line); outline-offset: -8px; min-height: 269mm; padding: 12mm 14mm; position: relative; }
        .head { display: grid; grid-template-columns: 70px 1fr 70px; align-items: center; text-align: center; }
        .head img { width: 64px; height: 64px; object-fit: contain; }
        .head .lines { line-height: 1.35; font-weight: bold; }
        .head .lines .republic { font-size: 15px; }
        .head .lines .council { font-size: 13px; margin-top: 10px; }
        .title { text-align: center; font-weight: bold; font-size: 20px; margin: 18px 0 8px; text-transform: uppercase; }
        .basis { text-align: center; font-weight: bold; font-size: 13.5px; margin-bottom: 18px; }
        .statement { font-size: 14.5px; margin-bottom: 14px; }
        table.fields { width: 100%; border-collapse: collapse; font-size: 14px; }
        table.fields td { padding: 6px 0; vertical-align: top; }
        table.fields td.label { width: 46%; padding-right: 12px; }
        table.fields td.value { font-weight: bold; text-transform: uppercase; }
        .signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 28px; text-align: center; font-size: 14px; }
        .signatures img.sig { height: 52px; max-width: 180px; object-fit: contain; display: block; margin: 0 auto -6px; }
        .signatures .dots { border-bottom: 2px dotted var(--line); width: 180px; margin: 0 auto 4px; height: 52px; }
        .signatures .dots.with-image { height: auto; }
        .signatures strong { display: block; letter-spacing: .5px; }
        .seal { position: absolute; right: 18mm; bottom: 58mm; width: 90px; height: 90px; object-fit: contain; opacity: .9; }
        .note { font-size: 11.5px; text-align: center; margin-top: 18px; font-weight: bold; }
        .note.left { text-align: left; }
        .conditions h2 { text-align: center; font-size: 16px; margin: 10px 0 18px; }
        .conditions ol { font-size: 14px; line-height: 1.5; padding-left: 22px; }
        .conditions li { margin-bottom: 12px; }
        .letter { font-family: Arial, sans-serif; font-size: 14px; line-height: 1.55; }
        .letter .meta { display: flex; justify-content: space-between; margin: 18px 0; }
        .letter h3 { text-align: center; text-decoration: underline; font-size: 15px; margin: 22px 0; }
        .letter .medicine { text-align: center; font-weight: bold; font-size: 17px; margin: 14px 0; }
        .letter table { border-collapse: collapse; margin: 10px 0 16px; }
        .letter table td { padding: 3px 14px 3px 0; vertical-align: top; }
        .letter .sign { margin-top: 36px; }
        .letter .sign img { height: 52px; max-width: 180px; object-fit: contain; display: block; }
        .watermark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .watermark span { transform: rotate(-30deg); font-size: 80px; font-weight: bold; color: rgba(200, 0, 0, .12); letter-spacing: 6px; }
        .page-break { page-break-before: always; }
        @media print {
            body { background: #fff; }
            .toolbar { display: none; }
            .page { margin: 0; box-shadow: none; width: auto; min-height: auto; padding: 8mm; }
            .frame { min-height: 279mm; }
            @page { size: A4 portrait; margin: 0; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <a href="javascript:history.back()">Back</a>
        <button onclick="window.print()">Print / Save as PDF</button>
    </div>
    {% block document %}{% endblock %}
</body>
</html>

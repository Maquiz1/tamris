{% if page.has_other_pages %}
<nav class="mt-3"><ul class="pagination pagination-sm justify-content-end">
    {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% if show %}show={{ show }}&{% endif %}page={{ page.previous_page_number }}">Previous</a></li>{% endif %}
    <li class="page-item disabled"><span class="page-link">Page {{ page.number }} of {{ page.paginator.num_pages }}</span></li>
    {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% if show %}show={{ show }}&{% endif %}page={{ page.next_page_number }}">Next</a></li>{% endif %}
</ul></nav>
{% endif %}

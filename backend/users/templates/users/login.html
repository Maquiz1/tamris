{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - TAMRIS{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 85vh;">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="icon-box lg bg-primary-lighten rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px; background-color: rgba(0, 123, 255, 0.1);">
                        <i class="ri-login-box-line text-primary fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Please sign in to your TAMRIS account</p>
                </div>
                
                <form method="post" action="{% url 'users:frontend_login' %}">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-4 py-2 fw-bold d-inline-flex align-items-center justify-content-center shadow-sm">
                        <i class="ri-login-box-line me-2"></i> Log In
                    </button>
                </form>
                
                <div class="text-center mt-4 pt-3 border-top">
                    <span class="small text-muted">Don't have an account? <a href="{% url 'users:frontend_register' %}" class="fw-bold text-decoration-none">Register here</a></span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

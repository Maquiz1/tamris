<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm border-bottom sticky-top">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center">
            {% if user.is_authenticated %}
            <button class="btn btn-light me-2 d-none d-md-block" id="sidebarToggle" type="button">
                <i class="bi bi-list fs-5"></i>
            </button>
            <button class="btn btn-light me-2 d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi bi-list fs-5"></i>
            </button>
            {% endif %}
            <a class="navbar-brand mb-0" href="#">TAMRIS</a>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                {% if user.is_authenticated %}
                    <li class="nav-item me-3">
                        <span class="nav-link text-muted">
                            <i class="bi bi-person-circle"></i> {{ user.email }}
                        </span>
                    </li>
                    <li class="nav-item">
                        <form method="post" action="{% url 'users:frontend_logout' %}" class="m-0">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3">
                                <i class="bi bi-box-arrow-right"></i> Logout
                            </button>
                        </form>
                    </li>
                {% else %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'users:frontend_login' %}">Login</a></li>
                    <li class="nav-item ms-2"><a class="btn btn-primary btn-sm rounded-pill px-3" href="{% url 'users:frontend_register' %}">Register</a></li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

{% extends 'base.html' %}

{% block title %}Password Reset Complete - TAMRIS{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 85vh;">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 p-4 p-md-5">
                <div class="text-center">
                    <div class="icon-box lg bg-success-lighten rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px; background-color: rgba(40, 167, 69, 0.1);">
                        <i class="ri-checkbox-circle-line text-success fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Password Changed</h3>
                    <p class="text-muted small mt-2">
                        Your password has been reset successfully. You may now log in with your new credentials.
                    </p>
                </div>
                
                <div class="text-center mt-4 pt-3 border-top">
                    <a href="{% url 'users:frontend_login' %}" class="btn btn-primary w-100 py-2 fw-bold d-inline-flex align-items-center justify-content-center shadow-sm">
                        <i class="ri-login-box-line me-2"></i> Log In Now
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

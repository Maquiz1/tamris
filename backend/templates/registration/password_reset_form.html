{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Reset Password - TAMRIS{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 85vh;">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="icon-box lg bg-warning-lighten rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px; background-color: rgba(255, 193, 7, 0.1);">
                        <i class="ri-key-line text-warning fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Reset Password</h3>
                    <p class="text-muted small">Enter your email address and we'll send you a link to reset your password.</p>
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-4 py-2 fw-bold d-inline-flex align-items-center justify-content-center shadow-sm">
                        <i class="ri-mail-send-line me-2"></i> Send Reset Link
                    </button>
                </form>
                
                <div class="text-center mt-4 pt-3 border-top">
                    <a href="{% url 'users:frontend_login' %}" class="small fw-bold text-decoration-none"><i class="ri-arrow-left-line me-1"></i> Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name live.tamris.org www.live.tamris.org tamris.org www.tamris.org 31.97.187.66;

    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        client_max_body_size 100M;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}

server {
    listen 80;
    server_name demo.tamris.org;

    location / {
        proxy_pass http://31.97.187.66:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        client_max_body_size 100M;
    }
}

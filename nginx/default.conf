upstream django {
    server web:8000;
}

# Redirect all HTTP requests to HTTPS
server {
    listen 80;
    server_name tamris.org www.tamris.org live.tamris.org www.live.tamris.org demo.tamris.org 31.97.187.66;
    
    # Certbot challenge path (just in case they use webroot verification)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Live HTTPS Server
server {
    listen 443 ssl;
    server_name tamris.org www.tamris.org live.tamris.org www.live.tamris.org 31.97.187.66;

    ssl_certificate /etc/letsencrypt/live/demo.tamris.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.tamris.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        client_max_body_size 100M;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}

# Demo HTTPS Server
server {
    listen 443 ssl;
    server_name demo.tamris.org;

    ssl_certificate /etc/letsencrypt/live/demo.tamris.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.tamris.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://31.97.187.66:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        client_max_body_size 100M;
    }
}
